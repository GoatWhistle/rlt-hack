[project]
name = "backend"
version = "0.1.0"
description = "Поиск релевантных поставщиков: API поиска, джоба сбора источников и хранилище ClickHouse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.9",
    "httpx[socks]>=0.28",
    "lxml>=5.3",
    "cssselect>=1.2",
    "openpyxl>=3.1",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "snowballstemmer>=3.0",
    "python-multipart>=0.0.20",
    "numpy>=2.2,<3",
    "pyarrow>=19,<24",
    "duckdb>=1.4,<2",
    "catboost>=1.2.8,<2",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
test = [
    "chdb==4.1.2; sys_platform != 'win32'",
    "chdb-core==26.9.0; sys_platform != 'win32'",
]

[project.scripts]
sync-job = "src.controller.job.cli:main"
api = "src.controller.api.main:run"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.19",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "lxml-stubs>=0.5",
    "hypothesis>=6.140",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "ERA", "PL", "PT", "TID", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "ANN", "PLR2004", "PLC0415"]
"tests/**/*_smoke.py" = ["PLR0912", "PLR0915", "PT017", "PT018"]
"tests/**/smoke.py" = ["PLR0912", "PLR0915", "PT017", "PT018"]
"tests/supplier/gisp_*.py" = ["PLR0912", "PLR0915", "PT017", "PT018"]
"tests/supplier/eis_registry_smoke.py" = ["E501"]
"src/adapter/supplier/**" = ["ANN", "ERA", "PL", "N"]
"src/adapter/repository/clickhouse/engine/gateway.py" = ["ANN401", "N801"]
"src/adapter/repository/clickhouse/engine/client.py" = ["ANN401"]
"src/adapter/repository/clickhouse/protocols.py" = ["ANN401"]
"src/controller/job/**" = ["ANN", "PL"]
"src/application/container.py" = ["PLR0912"]
"src/service/supplier/**" = ["PLR0912"]
"src/adapter/client/msp_registry/**" = ["ANN401"]
"src/adapter/repository/ranker/**" = ["ANN"]
"src/adapter/repository/supplier_index/**" = ["ANN", "ASYNC240"]
"src/application/encoder.py" = ["ANN"]
"src/application/supplier_index.py" = ["ANN"]
"src/application/supplier_search.py" = ["ANN"]
"src/controller/search/api.py" = ["ANN"]
"src/controller/search/import_history.py" = ["ANN"]
"src/controller/search/import_index.py" = ["ANN"]
"src/controller/uploads/**" = ["ANN", "N815"]
"tests/clickhouse/chdb_gateway.py" = ["PLR0911"]
"tests/search/**" = ["ASYNC240"]
"tests/supplier/eis_live.py" = ["ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = ["chdb: needs the embedded ClickHouse engine"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/adapter/supplier/*",
    "src/controller/job/*",
    "src/service/supplier/*",
    "src/adapter/repository/clickhouse/engine/client.py",
    "src/adapter/repository/clickhouse/catalog/journal.py",
    "src/adapter/repository/clickhouse/catalog/package.py",
    "src/adapter/repository/clickhouse/catalog/source.py",
    "src/adapter/repository/clickhouse/catalog/offer.py",
    "src/adapter/repository/clickhouse/catalog/supplier.py",
    "src/adapter/repository/clickhouse/engine/migrator.py",
    "src/adapter/repository/clickhouse/engine/versions.py",
    "src/application/container.py",
    "src/adapter/repository/clickhouse/engine/gateway.py",
    "src/adapter/repository/clickhouse/engine/config.py",
    "src/models/operations/journal.py",
    "src/models/catalog/package.py",
    "src/controller/api/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
exclude = [
    "^src/adapter/supplier/",
    "^src/service/supplier/",
    "^tests/supplier/",
    '^tests/clickhouse/schema_smoke\.py$',
    '^tests/clickhouse/normalization_smoke\.py$',
    '^tests/(classifier|normalizer)/.*_smoke\.py$',
    '^tests/embedding/batching_smoke\.py$',
    '^tests/(product|search|registry)/',
    '^tests/embedding/inference_smoke\.py$',
]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "chdb.*", "snowballstemmer.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.clickhouse.offer_batch_smoke",
    "tests.embedding.document_smoke",
    "tests.embedding.smoke",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "src.adapter.supplier.*",
    "src.service.supplier.*",
    "src.adapter.repository.clickhouse.catalog.offer",
    "src.controller.job.*",
    "src.adapter.repository.ranker.*",
    "src.adapter.repository.supplier_index.*",
    "src.adapter.repository.uploads.*",
    "src.service.registry.*",
    "src.controller.uploads.*",
    "src.controller.search.api",
    "src.controller.search.import_index",
    "src.controller.search.import_history",
    "src.application.encoder",
    "src.application.supplier_index",
    "src.application.supplier_search",
    "src.application.uploads",
]
ignore_errors = true
