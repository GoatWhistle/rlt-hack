name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --silent
        working-directory: frontend
      - run: npm run verify
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: failure()
        with:
          name: frontend-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install 'uv>=0.8,<1'
      - run: >-
          uv pip install --system -r backend/pyproject.toml --extra test
          'ruff>=0.14,<1' 'mypy>=1.19' 'pytest>=9.0' 'pytest-asyncio>=1.3' 'pytest-cov>=7.0'
          'hypothesis>=6.140' 'lxml-stubs>=0.5'
      - run: >-
          uv export --project backend --frozen --no-dev --no-emit-project
          --output-file "$RUNNER_TEMP/backend-requirements.txt"
      - run: >-
          uvx --from 'pip-audit>=2.9,<3' pip-audit --disable-pip
          --requirement "$RUNNER_TEMP/backend-requirements.txt"
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python -m mypy
        working-directory: backend
      - run: python -c "import chdb, chdb.session"
      - run: >-
          python -m pytest -p no:cacheprovider -rs
          --cov=src --cov-report=term:skip-covered
        working-directory: backend
        env:
          REQUIRE_CHDB: "1"
      - run: python backend/tests/clickhouse/schema_smoke.py
      - run: python backend/tests/clickhouse/normalization_smoke.py
      - run: python backend/tests/supplier/pulscen_smoke.py
      - run: python backend/tests/clickhouse/offer_batch_smoke.py
      - run: python backend/tests/supplier/job_smoke.py
      - run: python backend/tests/supplier/provider_smoke.py
      - run: python backend/tests/supplier/batching_smoke.py
      - run: python backend/tests/supplier/worker_smoke.py
      - run: python backend/tests/supplier/productcenter_smoke.py
      - run: python backend/tests/supplier/productcenter_job_smoke.py
      - run: python backend/tests/supplier/productcenter_resume_smoke.py
      - run: python backend/tests/supplier/gisp_registry.py
      - run: python backend/tests/supplier/gisp_api.py
      - run: python backend/tests/supplier/moscow_suppliers_smoke.py
      - run: python backend/tests/registry/registry_smoke.py
      - run: python backend/tests/registry/registry_store_smoke.py
      - run: python backend/tests/supplier/eis_registry_smoke.py
      - run: python backend/tests/supplier/gisp_snapshot.py
      - run: python backend/tests/supplier/supl_biz_smoke.py
      - run: python backend/tests/supplier/supl_biz_balanced_smoke.py
      - run: python backend/tests/product/moscow_smoke.py
      - run: python backend/tests/product/worker_smoke.py
      - run: python backend/tests/embedding/smoke.py
      - run: python backend/tests/embedding/inference_smoke.py
      - run: python backend/tests/embedding/batching_smoke.py
      - run: python backend/tests/embedding/document_smoke.py
      - run: python backend/tests/search/smoke.py
      - run: python backend/tests/search/clickhouse_smoke.py
      - run: python backend/tests/search/history_smoke.py
      - run: python backend/tests/search/ranker_smoke.py
      - run: python backend/tests/search/metadata_smoke.py
      - run: python backend/tests/search/upload_refresh_smoke.py

  ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -e './ml[dev]'
      - run: ruff check ml
      - run: python -m pytest ml/tests
