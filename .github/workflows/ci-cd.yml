name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --silent
        working-directory: frontend
      - run: npm run verify
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: frontend-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install 'uv>=0.8,<1'
      - run: uv pip install --system -r backend/pyproject.toml --extra test 'ruff>=0.14,<1'
      - run: ruff check backend
      - run: python backend/tests/clickhouse/schema_smoke.py
      - run: python backend/tests/supplier/job_smoke.py
      - run: python backend/tests/supplier/provider_smoke.py
      - run: python backend/tests/supplier/worker_smoke.py

  ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e './ml[dev]'
      - run: ruff check ml
      - run: python -m pytest ml/tests

  containers:
    needs: [frontend, backend, ml]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
      - name: Build immutable release
        run: bash deploy/package.sh "$GITHUB_SHA" "$RUNNER_TEMP/bundle"
      - name: Check migrations, backup and HTTP
        run: bash deploy/smoke.sh "$GITHUB_SHA" "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}:8081
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ github.sha }}
          path: bundle
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ $latest == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision exists; this deployment is skipped"
          fi
      - name: Deploy verified images
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/opt/rlt-hack/incoming/$GITHUB_SHA"
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${options[@]}" "$target" "mkdir -p '$incoming'"
          scp "${options[@]}" bundle/* "$target:$incoming/"
          ssh "${options[@]}" "$target" \
            "cd '$incoming' && sha256sum -c SHA256SUMS && bash activate.sh '$GITHUB_SHA' '$GITHUB_RUN_ID'"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 20 "http://$DEPLOY_HOST:8081/nginx-health"
