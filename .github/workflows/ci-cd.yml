name: CI and deploy

on:
  pull_request:
  push:
    branches: [main, deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --silent
        working-directory: frontend
      - run: npm run verify
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: failure()
        with:
          name: frontend-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install 'uv>=0.8,<1'
      - run: >-
          uv pip install --system -r backend/pyproject.toml --extra test
          'ruff>=0.14,<1' 'mypy>=1.19' 'pytest>=9.0' 'pytest-asyncio>=1.3' 'pytest-cov>=7.0'
          'hypothesis>=6.140' 'lxml-stubs>=0.5'
      - run: >-
          uv export --project backend --frozen --no-dev --no-emit-project
          --output-file "$RUNNER_TEMP/backend-requirements.txt"
      - run: >-
          uvx --from 'pip-audit>=2.9,<3' pip-audit --disable-pip
          --requirement "$RUNNER_TEMP/backend-requirements.txt"
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python -m mypy
        working-directory: backend
      - run: python -c "import chdb, chdb.session"
      - run: >-
          python -m pytest -p no:cacheprovider -rs
          --cov=src --cov-report=term:skip-covered
        working-directory: backend
        env:
          REQUIRE_CHDB: "1"
      - run: python backend/tests/clickhouse/schema_smoke.py
      - run: python backend/tests/clickhouse/normalization_smoke.py
      - run: python backend/tests/supplier/pulscen_smoke.py
      - run: python backend/tests/clickhouse/offer_batch_smoke.py
      - run: python backend/tests/supplier/job_smoke.py
      - run: python backend/tests/supplier/provider_smoke.py
      - run: python backend/tests/supplier/batching_smoke.py
      - run: python backend/tests/supplier/worker_smoke.py
      - run: python backend/tests/supplier/productcenter_smoke.py
      - run: python backend/tests/supplier/productcenter_job_smoke.py
      - run: python backend/tests/supplier/productcenter_resume_smoke.py
      - run: python backend/tests/supplier/gisp_registry.py
      - run: python backend/tests/supplier/gisp_api.py
      - run: python backend/tests/supplier/moscow_suppliers_smoke.py
      - run: python backend/tests/registry/registry_smoke.py
      - run: python backend/tests/registry/registry_store_smoke.py
      - run: python backend/tests/supplier/eis_registry_smoke.py
      - run: python backend/tests/supplier/gisp_snapshot.py
      - run: python backend/tests/supplier/supl_biz_smoke.py
      - run: python backend/tests/supplier/supl_biz_balanced_smoke.py
      - run: python backend/tests/product/moscow_smoke.py
      - run: python backend/tests/product/worker_smoke.py
      - run: python backend/tests/embedding/smoke.py
      - run: python backend/tests/embedding/inference_smoke.py
      - run: python backend/tests/embedding/batching_smoke.py
      - run: python backend/tests/embedding/document_smoke.py
      - run: python backend/tests/search/smoke.py
      - run: python backend/tests/search/clickhouse_smoke.py
      - run: python backend/tests/search/history_smoke.py
      - run: python backend/tests/search/ranker_smoke.py
      - run: python backend/tests/search/metadata_smoke.py
      - run: python backend/tests/search/upload_refresh_smoke.py

  ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -e './ml[dev]'
      - run: ruff check ml
      - run: python -m pytest ml/tests

  containers:
    needs: [frontend, backend, ml]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
      - name: Build immutable release
        run: bash deploy/package.sh "$GITHUB_SHA" "$RUNNER_TEMP/bundle"
      - name: Check migrations, backup and HTTP
        run: bash deploy/smoke.sh "$GITHUB_SHA" "$RUNNER_TEMP/bundle"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/deploy') && github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-${{ github.sha }}
          path: bundle
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ $latest == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision exists; this deployment is skipped"
          fi
      - name: Deploy verified images
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_URL"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT
          target="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/opt/rlt-hack/incoming/$GITHUB_SHA"
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${options[@]}" "$target" "mkdir -p '$incoming'"
          scp "${options[@]}" bundle/* "$target:$incoming/"
          ssh "${options[@]}" "$target" \
            "cd '$incoming' && sha256sum -c SHA256SUMS && bash activate.sh '$GITHUB_SHA' '$GITHUB_RUN_ID'"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 20 "$DEPLOY_URL/nginx-health"

  deploy-vm:
    if: github.ref == 'refs/heads/deploy' && github.event_name == 'push' && vars.VM_DEPLOY_ENABLED == 'true'
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: vm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: deploy/vm_known_hosts
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-${{ github.sha }}
          path: bundle
      - name: Check current deploy revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deploy" --jq .object.sha)
          if [[ $latest == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer deploy revision exists; this deployment is skipped"
          fi
      - name: Deploy verified images to 51.250.72.225
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VM_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT
          target="rlt-deploy@51.250.72.225"
          incoming="/opt/rlt-hack/incoming/$GITHUB_SHA"
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15
            -o "UserKnownHostsFile=$GITHUB_WORKSPACE/deploy/vm_known_hosts")
          ssh "${options[@]}" "$target" "mkdir -p '$incoming'"
          scp "${options[@]}" bundle/* "$target:$incoming/"
          ssh "${options[@]}" "$target" \
            "cd '$incoming' && sha256sum -c SHA256SUMS && bash activate.sh '$GITHUB_SHA' '$GITHUB_RUN_ID' && rm -rf '$incoming'"
