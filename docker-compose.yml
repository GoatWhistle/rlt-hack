# Локальный запуск: фронтенд, хранилище ClickHouse, миграции и джоба сбора поставщиков.
services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.9}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-supplier_search}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Применяет миграции и завершается. Запускается при каждом `up`.
  migrate:
    build:
      context: ./backend
    restart: "no"
    command: ["migrate"]
    environment: &job-environment
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-supplier_search}
      TASK_DATA_DIR: /data/task
      # Каждый адаптер источника включается своим флагом.
      SUPPLIER_DATASET_PROVIDER: ${SUPPLIER_DATASET_PROVIDER:-true}
      SUPPLIER_DATASET_REGION: ${SUPPLIER_DATASET_REGION:-}
      YML_FEED_PROVIDER: ${YML_FEED_PROVIDER:-false}
      SUPPLIER_FEED_URLS: ${SUPPLIER_FEED_URLS:-}
      SCHEMA_ORG_WEB_PROVIDER: ${SCHEMA_ORG_WEB_PROVIDER:-false}
      SUPPLIER_SITE_URLS: ${SUPPLIER_SITE_URLS:-}
      OPTKATALOG_WEB_PROVIDER: ${OPTKATALOG_WEB_PROVIDER:-false}
      ABOUTPARTNER_WEB_PROVIDER: ${ABOUTPARTNER_WEB_PROVIDER:-false}
      TEXZAKAZ_WEB_PROVIDER: ${TEXZAKAZ_WEB_PROVIDER:-false}
      SYNC_PARALLEL_SOURCES: ${SYNC_PARALLEL_SOURCES:-4}
      SYNC_PARALLEL_REQUESTS: ${SYNC_PARALLEL_REQUESTS:-4}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: &job-volumes
      - ./task/data:/data/task:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # Обход включённых источников: `docker compose run --rm sync-job sync`.
  sync-job:
    build:
      context: ./backend
    profiles: ["jobs"]
    restart: "no"
    command: ["sync"]
    environment: *job-environment
    volumes: *job-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  clickhouse-data:
