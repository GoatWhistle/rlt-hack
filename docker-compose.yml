# Локальный запуск: фронтенд, хранилище ClickHouse с веб-интерфейсом, миграции и джоба сбора поставщиков.
services:
  search-api:
    build:
      context: ./backend
    profiles: ["search"]
    env_file:
      - path: ${EMBEDDING_ENV_FILE:-./.env.embedding.local}
        required: false
    restart: unless-stopped
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["src.controller.search.api:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*", "--limit-concurrency", "8"]
    environment:
      SUPPLIER_INDEX_DIR: /data/index
      SUPPLIER_INDEX_ID: ${SUPPLIER_INDEX_ID:-}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-supplier_search}
      UPLOADS_DIR: /data/uploads
      EMBEDDING_URL: http://embedder:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:4b}
      EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-}
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
    volumes:
      - ${SUPPLIER_INDEX_PATH:-./data/supplier-index}:/data/index:ro
      - search-uploads:/data/uploads
    ports:
      - "127.0.0.1:${SEARCH_API_PORT:-18082}:8080"
    mem_limit: 2200m
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: deploy/frontend.Dockerfile
  #     target: runtime
  #     args:
  #       VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
  #   ports:
  #     - "${WEB_PORT:-8080}:8080"
  #   restart: unless-stopped

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.9}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-supplier_search}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Веб-интерфейс ClickHouse: запросы и обзор таблиц в браузере.
  clickhouse-ui:
    image: ${CLICKHOUSE_UI_IMAGE:-ghcr.io/caioricciuti/ch-ui:v2.14.1}
    environment:
      # Доступ передаётся внутри URL: ch-ui ходит в ClickHouse сам, из контейнера.
      CLICKHOUSE_URL: ${CLICKHOUSE_UI_URL:-http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-}@clickhouse:8123}
      CONNECTION_NAME: ${CLICKHOUSE_DATABASE:-supplier_search}
    ports:
      - "${CLICKHOUSE_UI_PORT:-3488}:3488"
    volumes:
      - clickhouse-ui-data:/app/data
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy

  # Применяет миграции и завершается. Запускается при каждом `up`.
  migrate:
    build:
      context: ./backend
    restart: "no"
    command: ["migrate"]
    environment: &job-environment
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-supplier_search}
      CLICKHOUSE_SECURE: ${CLICKHOUSE_SECURE:-false}
      TASK_DATA_DIR: /data/task
      SUPPLIER_DATASET_PATH: ${SUPPLIER_DATASET_PATH:-}
      # Каждый адаптер источника включается своим флагом.
      SUPPLIER_DATASET_PROVIDER: ${SUPPLIER_DATASET_PROVIDER:-true}
      SUPPLIER_DATASET_REGION: ${SUPPLIER_DATASET_REGION:-}
      YML_FEED_PROVIDER: ${YML_FEED_PROVIDER:-false}
      SUPPLIER_FEED_URLS: ${SUPPLIER_FEED_URLS:-}
      SCHEMA_ORG_WEB_PROVIDER: ${SCHEMA_ORG_WEB_PROVIDER:-false}
      SUPPLIER_SITE_URLS: ${SUPPLIER_SITE_URLS:-}
      OPTKATALOG_WEB_PROVIDER: ${OPTKATALOG_WEB_PROVIDER:-true}
      ABOUTPARTNER_WEB_PROVIDER: ${ABOUTPARTNER_WEB_PROVIDER:-true}
      TEXZAKAZ_WEB_PROVIDER: ${TEXZAKAZ_WEB_PROVIDER:-true}
      PULSCEN_WEB_PROVIDER: ${PULSCEN_WEB_PROVIDER:-false}
      PULSCEN_DELAY_SECONDS: ${PULSCEN_DELAY_SECONDS:-10}
      GISP_REGISTRY_PROVIDER: ${GISP_REGISTRY_PROVIDER:-false}
      GISP_EXPORT_LOCATION: ${GISP_EXPORT_LOCATION:-}
      PRODUCTCENTER_WEB_PROVIDER: ${PRODUCTCENTER_WEB_PROVIDER:-false}
      PRODUCTCENTER_MAX_CARDS: ${PRODUCTCENTER_MAX_CARDS:-0}
      PRODUCTCENTER_PARALLEL_REQUESTS: ${PRODUCTCENTER_PARALLEL_REQUESTS:-1}
      PRODUCTCENTER_REQUEST_INTERVAL: ${PRODUCTCENTER_REQUEST_INTERVAL:-1}
      PRODUCTCENTER_CONNECTION_RETRIES: ${PRODUCTCENTER_CONNECTION_RETRIES:-180}
      PRODUCTCENTER_CACHE_DIR: ${PRODUCTCENTER_CACHE_DIR:-/data/productcenter-cache}
      MOSCOW_SUPPLIERS_PROVIDER: ${MOSCOW_SUPPLIERS_PROVIDER:-false}
      MOSCOW_SUPPLIERS_EXPORT_URL: ${MOSCOW_SUPPLIERS_EXPORT_URL:-}
      # ZIP-выгрузка реестра МСП ФНС для `registry-import`; каталог вне Git.
      MSP_REGISTRY_PATH: ${MSP_REGISTRY_PATH:-/data/msp/rmsp.zip}
      SUPL_BIZ_WEB_PROVIDER: ${SUPL_BIZ_WEB_PROVIDER:-false}
      SUPL_BIZ_MAX_CARDS: ${SUPL_BIZ_MAX_CARDS:-0}
      EIS_REGISTRY_PROVIDER: ${EIS_REGISTRY_PROVIDER:-false}
      EIS_PERIOD_START: ${EIS_PERIOD_START:-}
      EIS_PERIOD_DAYS: ${EIS_PERIOD_DAYS:-30}
      EIS_MAX_CONTRACTS: ${EIS_MAX_CONTRACTS:-0}
      EIS_CA_BUNDLE: ${EIS_CA_BUNDLE:-}
      EIS_VERIFY_TLS: ${EIS_VERIFY_TLS:-true}
      EIS_PROXY: ${EIS_PROXY:-}
      EIS_REQUEST_INTERVAL: ${EIS_REQUEST_INTERVAL:-1.0}
      MOSCOW_PRODUCTS_PROVIDER: ${MOSCOW_PRODUCTS_PROVIDER:-false}
      MOSCOW_PRODUCTS_PAGE_SIZE: ${MOSCOW_PRODUCTS_PAGE_SIZE:-500}
      MOSCOW_PRODUCTS_RETRY_ATTEMPTS: ${MOSCOW_PRODUCTS_RETRY_ATTEMPTS:-12}
      SYNC_PARALLEL_SOURCES: ${SYNC_PARALLEL_SOURCES:-4}
      SYNC_PARALLEL_REQUESTS: ${SYNC_PARALLEL_REQUESTS:-4}
      SYNC_WRITE_BATCH: ${SYNC_WRITE_BATCH:-5000}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-32}
      SYNC_MAX_CARDS: ${SYNC_MAX_CARDS:-500}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-3600}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: &job-volumes
      - ./task/data:/data/task:ro
      - productcenter-cache:${PRODUCTCENTER_CACHE_DIR:-/data/productcenter-cache}
      - ${MSP_REGISTRY_DIR:-./var/msp}:/data/msp:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # Обход включённых источников: `docker compose run --rm sync-job sync`.
  sync-job:
    build:
      context: ./backend
    profiles: ["jobs"]
    restart: "no"
    command: ["sync"]
    environment: *job-environment
    volumes: *job-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully

  parser-worker:
    extends:
      service: sync-job
    profiles: ["workers"]
    restart: unless-stopped
    command: ["sync", "--forever"]
    mem_limit: 768m
    cpus: 1

  embedder:
    image: ollama/ollama:0.34.2
    profiles: ["ml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-11435}:11434"
    environment:
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_CONTEXT_LENGTH: 512
    volumes:
      - embedding-models:/root/.ollama
    mem_limit: 3500m
    cpus: 2
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  embedding-worker:
    build:
      context: ./backend
    profiles: ["ml"]
    env_file:
      - path: ${EMBEDDING_ENV_FILE:-./.env.embedding.local}
        required: false
    restart: unless-stopped
    entrypoint: ["python", "-m", "src.controller.embedding.cli"]
    command: ["index", "--forever", "--batch-size", "${EMBEDDING_BATCH_SIZE:-16}", "--interval", "${EMBEDDING_BATCH_WAIT_SECONDS:-5}"]
    environment:
      <<: *job-environment
      EMBEDDING_URL: http://embedder:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:4b}
      EMBEDDING_MODEL_DIGEST: ${EMBEDDING_MODEL_DIGEST:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-2560}
      EMBEDDING_CONTEXT_LENGTH: ${EMBEDDING_CONTEXT_LENGTH:-512}
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      clickhouse:
        condition: service_healthy
      embedder:
        condition: service_healthy

volumes:
  search-uploads:
  clickhouse-data:
  clickhouse-ui-data:
  productcenter-cache:
  embedding-models:
