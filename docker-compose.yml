services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
