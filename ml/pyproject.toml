[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rlt-ml"
version = "0.1.0"
description = "Подготовка данных и обучение рекомендателя поставщиков"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb>=1.3,<2",
  "pyarrow>=19,<24",
  "numpy>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "catboost>=1.2.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
gpu = [
  "torch>=2.7,<3",
  "transformers>=4.51,<5",
  "peft>=0.15,<1",
  "accelerate>=1.2,<2",
  "bitsandbytes>=0.49,<1",
]

[project.scripts]
rlt-prepare = "rlt_ml.prepare:main"
rlt-train-ranker = "rlt_ml.ranker:main"
rlt-train-encoder = "rlt_ml.encoder:main"
rlt-gpu-check = "rlt_ml.gpu_check:main"
rlt-evaluate-retrieval = "rlt_ml.retrieval:main"
rlt-cache-models = "rlt_ml.cache_models:main"
rlt-build-card-variants = "rlt_ml.cards:main"
rlt-audit-card-variants = "rlt_ml.card_audit:main"
rlt-compare-card-variants = "rlt_ml.compare_cards:main"
rlt-evaluate-candidate-ranker = "rlt_ml.candidate_ranker:main"
rlt-pipeline-cases = "rlt_ml.pipeline_cases:main"
rlt-evaluate-pipeline = "rlt_ml.pipeline_eval:main"
rlt-review-new-suppliers = "rlt_ml.new_suppliers:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_encoder.py" = ["E402"]
