model = "intfloat/multilingual-e5-base"
seed = 42
max_length = 256
batch_size = 8
gradient_accumulation = 8
gradient_checkpointing = true
learning_rate = 0.00002
weight_decay = 0.01
epochs = 1
temperature = 0.05
precision = "bf16"
max_steps = 200
save_every = 100
max_train_pairs = 100000

# По умолчанию короткий прогон. Для полного запуска: --max-steps 0.
# Накопление градиентов не увеличивает пул отрицательных примеров внутри батча.
