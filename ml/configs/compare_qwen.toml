seed = 42
max_queries = 1000
max_length = 256
top_k = 100
query_instruction = "Given a Russian procurement notice, retrieve supplier activity profiles relevant to fulfilling this procurement."
models = ["Qwen/Qwen3-Embedding-0.6B", "Qwen/Qwen3-Embedding-4B"]
batch_size = 4

# В 4B-run параметр batch_size переопределяется на 1.
# Две модели применяются параллельно; индексы остаются в RAM.
