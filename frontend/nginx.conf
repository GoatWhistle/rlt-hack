map $http_x_request_id $api_request_id {
  default $http_x_request_id;
  "" $request_id;
}

map "$request_method:$uri" $search_limit_key {
  "~^POST:/api/searches/?$" $binary_remote_addr;
  default "";
}

map $request_method $upload_limit_key {
  POST $binary_remote_addr;
  default "";
}

limit_req_zone $search_limit_key zone=search:10m rate=2r/s;
limit_req_zone $upload_limit_key zone=upload:10m rate=6r/m;
limit_conn_zone $upload_limit_key zone=upload_connections:10m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  server_tokens off;

  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_status 429;
  limit_conn_status 429;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

  location @rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    add_header X-Request-Id $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"code":"rate_limited","message":"too many requests","requestId":"$request_id"}';
  }

  location = /api/metrics {
    default_type application/json;
    add_header X-Request-Id $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404 '{"code":"not_found","message":"not found","requestId":"$request_id"}';
  }

  location = /nginx-health {
    access_log off;
    return 200 "ok";
  }

  location /api/uploads {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $search_backend http://search-api:8080;
    proxy_pass $search_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 180s;
    client_max_body_size 2m;
    limit_req zone=upload burst=3 nodelay;
    limit_conn upload_connections 2;
    error_page 429 = @rate_limited;
  }

  location /api/searches {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Request-Id $api_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    limit_req zone=search burst=10 nodelay;
    error_page 429 = @rate_limited;
  }

  location ~ ^/api/suppliers/(?!search$)[^/]+$ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Request-Id $api_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location /api/analytics/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Request-Id $api_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_send_timeout 30s;
  }

  location /api/health/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Request-Id $api_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $search_backend http://search-api:8080;
    proxy_pass $search_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 180s;
    client_max_body_size 2m;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
